# SPDX-License-Identifier: GPL-3.0-only
#:schema https://jorge-menjivar.github.io/super-stt/backend.schema.json
# Voxtral (local, GPU) subprocess backend, on Burn. See docs/protocol/backend/.

[backend]
    source = "github.com/jorge-menjivar/super-stt-voxtral"
    name = "Voxtral"
    version = "0.2.0"
    kind = "subprocess"
    entrypoint = "super-stt-backend-voxtral"
    contract = "v1"
    license = "GPL-3.0-only"
    description = "Local Voxtral speech-to-text."

[network]
    allowed_hosts = []

# One entry per tarball `.github/workflows/release.yml` builds — the filenames
# must match it exactly, since the indexer resolves them against the release's
# assets and pins their hashes. The archives hold the binary at their root,
# which is where `entrypoint` above says to find it.
#
# One build per (target, accelerator), and every accelerator a GPU: the models
# are too big for a CPU build to be worth shipping. There is no
# compute-capability axis: Burn compiles every kernel at runtime through
# CubeCL — NVRTC on CUDA, hiprtc on ROCm, SPIR-V on Vulkan, MSL on Metal — so
# one CUDA build serves every NVIDIA generation the installed driver can
# compile for, where candle's ahead-of-time build needed one asset per SM. What
# is left is the CUDA major version, which decides the API the binary was
# built against.

[[assets.subprocess]]
    file = "voxtral-x86_64-unknown-linux-gnu-cuda12.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "cuda"
    cuda_major = 12
    # No `cuda_sm`: the kernels are compiled on the host by NVRTC, so this
    # build matches any compute capability, which is what omitting it declares.

[[assets.subprocess]]
    file = "voxtral-x86_64-unknown-linux-gnu-cuda13.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "cuda"
    cuda_major = 13

# AMD. The kernels are compiled at runtime here too, so this list is not the
# set of architectures the binary carries code for — it is the set the backend
# is claimed to work on, which the schema requires to be explicit because an
# ahead-of-time HIP build could not honestly claim more. RDNA2 through RDNA4
# and the CDNA parts; a card outside it will usually work and is simply not
# advertised.
[[assets.subprocess]]
    file = "voxtral-x86_64-unknown-linux-gnu-rocm.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "rocm"
    gfx = [
        "gfx90a",
        "gfx942",
        "gfx1030",
        "gfx1100",
        "gfx1101",
        "gfx1102",
        "gfx1200",
        "gfx1201",
    ]

# The vendor-neutral GPU path: Intel, an AMD card on the Mesa driver, an NVIDIA
# card without CUDA installed. Slower than the native backends, and ranked
# below them by the daemon, but it is the only GPU some hosts have.
[[assets.subprocess]]
    file = "voxtral-x86_64-unknown-linux-gnu-vulkan.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "vulkan"
    vulkan_api = "1.2"

# macOS on Apple Silicon. Metal compiles its kernels at runtime like the other
# GPU builds, so it has nothing to select on beyond the target. The GPU shares
# the system's memory there, so the models' `estimated_vram_bytes` is RAM.
[[assets.subprocess]]
    file = "voxtral-aarch64-apple-darwin-metal.tar.gz"
    target = "aarch64-apple-darwin"
    accel = "metal"

[[models]]
    name = "voxtral-mini-3b-2507"
    provider = "local_voxtral"
    multilingual = true
    primary_language = "en"
    supported_languages = ["en", "es", "fr", "pt", "hi", "de", "nl", "it"]
    supported_devices = ["gpu"]
    # Measured on an RTX 3090 in f16: 9.0 GiB resident while idle, 8.7 GiB of
    # it weights; a transcription takes it to about 11.3 GiB with the key/value
    # caches and activations, handed back after each one. The first load on a
    # machine peaks near 16.2 GiB for a minute or two while CubeCL tunes its
    # kernels, then settles back; later loads read the tuning from the kernel
    # cache and never reach it.
    estimated_vram_bytes = 12884901888
    processing_interval_ms = 2000

    files = [
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/config.json", destination = "models/voxtral-mini-3b-2507/config.json" },
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/tekken.json", destination = "models/voxtral-mini-3b-2507/tekken.json" },
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/model-00001-of-00002.safetensors", destination = "models/voxtral-mini-3b-2507/model-00001-of-00002.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/model-00002-of-00002.safetensors", destination = "models/voxtral-mini-3b-2507/model-00002-of-00002.safetensors" },
    ]

[[models]]
    name = "voxtral-small-24b-2507"
    provider = "local_voxtral"
    multilingual = true
    primary_language = "en"
    supported_languages = ["en", "es", "fr", "pt", "hi", "de", "nl", "it"]
    supported_devices = ["gpu"]
    estimated_vram_bytes = 55834574848
    processing_interval_ms = 2000

    # Sharded HF transformers weights only — the repo also ships a single-file
    # `consolidated.safetensors`, which is deliberately omitted: the backend
    # mmaps every `*.safetensors` in the dir, so pulling both would duplicate
    # the ~48 GB of weights.
    files = [
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/config.json", destination = "models/voxtral-small-24b-2507/config.json" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/tekken.json", destination = "models/voxtral-small-24b-2507/tekken.json" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00001-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00001-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00002-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00002-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00003-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00003-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00004-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00004-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00005-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00005-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00006-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00006-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00007-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00007-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00008-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00008-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00009-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00009-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00010-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00010-of-00011.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Small-24B-2507/resolve/main/model-00011-of-00011.safetensors", destination = "models/voxtral-small-24b-2507/model-00011-of-00011.safetensors" },
    ]
