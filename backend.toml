# SPDX-License-Identifier: GPL-3.0-only
#:schema https://jorge-menjivar.github.io/super-stt/backend.schema.json
# Voxtral (local, GPU) subprocess backend, on Burn. See docs/protocol/backend/.

[backend]
    id = "app.super-stt.voxtral"
    source = "github.com/jorge-menjivar/super-stt-voxtral"
    name = "Voxtral"
    version = "0.2.0"
    kind = "subprocess"
    entrypoint = "super-stt-backend-voxtral"
    contract = "v4"
    product = "super-stt"
    license = "GPL-3.0-only"
    description = "Local Voxtral speech-to-text."

[network]
    allowed_hosts = []

[[assets.subprocess]]
    file = "voxtral-x86_64-unknown-linux-gnu-cuda12.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "cuda"
    cuda_major = 12
    # No `cuda_sm`: the kernels are compiled on the host by NVRTC, so this
    # build matches any compute capability, which is what omitting it declares.

[[assets.subprocess]]
    file = "voxtral-x86_64-unknown-linux-gnu-cuda13.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "cuda"
    cuda_major = 13

# AMD. The kernels are compiled at runtime here too, so this list is not the
# set of architectures the binary carries code for — it is the set the backend
# is claimed to work on, which the schema requires to be explicit. A card
# outside it gets the Vulkan build.
[[assets.subprocess]]
    file = "qwen3-asr-x86_64-unknown-linux-gnu-rocm.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "rocm"
    gfx = [
        "gfx908",
        "gfx90a",
        "gfx942",
        "gfx1013",
        "gfx1030",
        "gfx1100",
        "gfx1101",
        "gfx1102",
        "gfx1150",
        "gfx1151",
        "gfx1152",
        "gfx1200",
        "gfx1201",
    ]

# The vendor-neutral GPU path: Intel, an AMD card on the Mesa driver, an NVIDIA
# card without CUDA installed. Slower than the native backends, and ranked
# below them by the daemon, but it is the only GPU some hosts have.
[[assets.subprocess]]
    file = "voxtral-x86_64-unknown-linux-gnu-vulkan.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "vulkan"
    vulkan_api = "1.2"

[[assets.subprocess]]
    file = "voxtral-aarch64-apple-darwin-metal.tar.gz"
    target = "aarch64-apple-darwin"
    accel = "metal"

[[models]]
    name = "voxtral-mini-3b-2507"
    provider = "local_voxtral"
    multilingual = true
    primary_language = "en"
    supported_languages = ["en", "es", "fr", "pt", "hi", "de", "nl", "it"]
    supported_devices = ["gpu"]
    estimated_vram_bytes = 12884901888
    processing_interval_ms = 2000

    files = [
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/config.json", destination = "models/voxtral-mini-3b-2507/config.json" },
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/tekken.json", destination = "models/voxtral-mini-3b-2507/tekken.json" },
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/model-00001-of-00002.safetensors", destination = "models/voxtral-mini-3b-2507/model-00001-of-00002.safetensors" },
        { url = "https://huggingface.co/mistralai/Voxtral-Mini-3B-2507/resolve/main/model-00002-of-00002.safetensors", destination = "models/voxtral-mini-3b-2507/model-00002-of-00002.safetensors" },
    ]

