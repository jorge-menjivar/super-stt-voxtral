# SPDX-License-Identifier: GPL-3.0-only
# Standalone Voxtral subprocess backend. Depends only on third-party crates —
# no super-stt code. Excluded from the workspace (own Cargo.lock).

[package]
    name = "super-stt-backend-voxtral"
    version = "0.2.0"
    edition = "2024"
    description = "Voxtral speech-to-text backend for Super STT."
    repository = "https://github.com/jorge-menjivar/super-stt-voxtral"
    license = "GPL-3.0-only"
    publish = false

# Own workspace root — never absorbed into a parent workspace.
[workspace]

[[bin]]
    name = "super-stt-backend-voxtral"
    path = "src/main.rs"

[dependencies]
    anyhow = "1"
    axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
    # The model in `src/voxtral` is written against Burn, pinned by revision to
    # the fork's `qwen3-tts` branch, which the Qwen TTS backend builds on too:
    # upstream Burn is missing fixes that fork carries, to its fusion crates and
    # to `into_data`, whose bytes a later in-place kernel could overwrite. `burn`
    # has no stability guarantee between revisions anyway.
    #
    # Burn is what buys this backend ROCm and Vulkan, which candle cannot reach
    # at all — CubeCL compiles every kernel at runtime for whatever device it
    # finds, which is also why one build per target covers every GPU generation
    # instead of one per CUDA compute capability.
    burn = {
        git = "https://github.com/jorge-menjivar/burn.git",
        rev = "1e9de733d6ff94f34c34a5765ea0b4926478f989",
        features = ["default", "cubecl"]
    }
    # The binary's build ID, which CubeCL keys its compiled kernels on: the
    # warm marker in `inference.rs` goes by the same key. Already in the
    # graph through CubeCL.
    buildid = "1"
    burn-store = {
        git = "https://github.com/jorge-menjivar/burn.git",
        rev = "1e9de733d6ff94f34c34a5765ea0b4926478f989",
        features = ["std", "safetensors"]
    }
    env_logger = "0.11"
    hyper = { version = "1", features = ["http1", "server"] }
    hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
    log = "0.4"
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    tekken = { version = "0.2.0", default-features = false, features = ["audio"] }
    tokio = {
        version = "1",
        features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"]
    }

[dev-dependencies]
    bytes = "1"
    hound = "3.5"
    http-body-util = "0.1"
    hyper = { version = "1", features = ["client", "http1"] }
    # Reads the candle dump the layer-by-layer parity test compares against.
    # The version burn-store already builds.
    safetensors = "0.7"
    tempfile = "3"
    # `ServiceExt::oneshot` for in-process router/handler tests.
    tower = { version = "0.5", features = ["util"] }

# One accelerator per build, as the asset it ships in declares, and every one
# of them a GPU: the models are too big for a CPU build to be worth shipping,
# Voxtral Mini's weights alone being 8.7 GiB in bf16. `vulkan` is the default
# because it is the one that builds anywhere: no SDK, and the loader is found
# at runtime.
[features]
    default = ["vulkan"]
    cuda = ["burn/cuda"]
    metal = ["burn/metal"]
    rocm = ["burn/rocm"]
    vulkan = ["burn/vulkan"]

# The CubeCL the Burn fork's `qwen3-tts` branch builds against: the pinned
# upstream revision plus its `compilation-cache-default` branch. A `[patch]` in
# Burn's own manifest does not reach a build that merely depends on Burn —
# patches come from the root of the crate being built — so this backend has to
# repeat it, or it would build a different CubeCL than the fork was measured
# on. It keeps compiled kernels across runs by default, coalesces the sliced
# memory pool's free slices lazily, and lets the channel server take a partial
# batch when its producer pauses.
[patch."https://github.com/tracel-ai/cubecl"]
    cubecl = { git = "https://github.com/jorge-menjivar/cubecl", rev = "46f7861b8e941823bcff79238b5181f78c6364dd" }
    cubecl-common = { git = "https://github.com/jorge-menjivar/cubecl", rev = "46f7861b8e941823bcff79238b5181f78c6364dd" }
    cubecl-environment = { git = "https://github.com/jorge-menjivar/cubecl", rev = "46f7861b8e941823bcff79238b5181f78c6364dd" }
    cubecl-ir = { git = "https://github.com/jorge-menjivar/cubecl", rev = "46f7861b8e941823bcff79238b5181f78c6364dd" }
    cubecl-zspace = { git = "https://github.com/jorge-menjivar/cubecl", rev = "46f7861b8e941823bcff79238b5181f78c6364dd" }
